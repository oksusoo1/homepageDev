
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('erd-svg', `erDiagram
  sellers {
    uuid id PK
    string email
    string name
    string phone
    string status
    int current_customer_count
    string tier
    timestamp created_at
  }
  sites {
    uuid id PK
    string site_id
    string subdomain
    string domain
    uuid seller_id FK
    string name
    string description
    string address
    string phone
    string status
    timestamp created_at
  }
  client_billings {
    uuid id PK
    uuid site_id FK
    uuid seller_id FK
    int amount
    int platform_pct
    int seller_pct
    int billing_day
    string status
    date next_billing_date
    string memo
    timestamp created_at
  }
  billing_history {
    uuid id PK
    uuid billing_id FK
    string period
    int amount
    int platform_amount
    int seller_amount
    string status
    timestamp paid_at
    string payment_method
    timestamp created_at
  }
  settlements {
    uuid id PK
    uuid seller_id FK
    string period
    int total_amount
    int seller_amount
    int extra_fee
    int final_payout
    string status
    timestamp settled_at
    timestamp created_at
  }
  support_tickets {
    uuid id PK
    uuid site_id FK
    uuid seller_id FK
    string title
    string content
    string status
    int response_deadline_days
    timestamp deadline_at
    timestamp resolved_at
    timestamp created_at
  }
  tier_history {
    uuid id PK
    uuid seller_id FK
    string prev_tier
    string new_tier
    int customer_count
    string reason
    timestamp changed_at
  }
  posts {
    uuid id PK
    string site_id FK
    string title
    string content
    string author
    timestamp created_at
  }

  sellers ||--o{ sites : "manages"
  sellers ||--o{ client_billings : "has"
  sellers ||--o{ settlements : "receives"
  sellers ||--o{ tier_history : "tracks"
  sites ||--o{ client_billings : "billed_via"
  sites ||--o{ support_tickets : "requests"
  sites ||--o{ posts : "contains"
  client_billings ||--o{ billing_history : "generates"
  sellers ||--o{ support_tickets : "handles"
`);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
